[package]
name = "razerctl"
version = "0.1.0"
edition = "2024"
description = "Linux polling-rate and DPI control for supported Razer mice"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }
